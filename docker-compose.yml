services:
  pow-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pow-analyzer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G
